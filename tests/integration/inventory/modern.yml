---
# Hosts run by the ansible-core 2.16 controller.
all:
  children:
    rhel7:
      hosts:
        el7-webserver: {}
        el7-minimal: {}
    rhel9:
      hosts:
        el9-inventory: {}
    rhel10:
      hosts:
        el10-inventory: {}
    ubuntu:
      hosts:
        ubuntu2404-inventory: {}
  vars:
    # Opt in to the migration layer; only the RHEL-family 6/7/8 hosts take it.
    disco_profile: migration
    ansible_user: ansible
    ansible_ssh_private_key_file: /home/ansible/.ssh/id_ecdsa
    ansible_port: 22
    ansible_python_interpreter: auto_silent
