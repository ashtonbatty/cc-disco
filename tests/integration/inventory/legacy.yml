---
# Hosts run by the ansible-core 2.11 controller (Python 2.6 targets).
all:
  children:
    rhel6:
      hosts:
        el6-legacy:
          ansible_python_interpreter: /usr/bin/python
  vars:
    # Opt in to the migration layer; only the RHEL-family 6/7/8 hosts take it.
    disco_profile: migration
    ansible_user: ansible
    ansible_ssh_private_key_file: /home/ansible/.ssh/id_ecdsa
    ansible_port: 22
