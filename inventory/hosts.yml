---
# Server Discovery Inventory
#
# Populate with your actual hosts. Grouping by OS lets you --limit runs and set
# per-OS connection settings. The playbook picks the discovery profile from
# gathered facts, not from group names, with one exception: Windows hosts must
# be in the `windows` group.
#
# Controller versions (see README "Controller requirements"):
#   rhel6           -> ansible-core 2.11
#   everything else -> ansible-core 2.16 (or later, without RHEL 7/8)
#
# Usage:
#   ansible-playbook gather_facts.yml                        # all hosts
#   ansible-playbook gather_facts.yml --limit rhel8          # only RHEL 8
#   ansible-playbook gather_facts.yml --limit server1.example.com

all:
  children:
    rhel6:
      hosts:
        # server1.example.com:
        #   ansible_host: 10.0.1.10
      vars:
        # RHEL 6 ships Python 2.6, which only ansible-core 2.11 supports.
        # Set to /usr/bin/python if python2.6 is not available at this path.
        ansible_python_interpreter: /usr/bin/python2.6
        # Disable pipelining on RHEL 6 if sudoers has "Defaults requiretty"
        ansible_ssh_pipelining: false
        # Use ECDSA host and login keys: OpenSSH 5.3 has no ed25519, and its
        # RSA signatures are SHA-1, which modern controllers refuse (README:
        # "SSH to RHEL 6").

    rhel7:
      hosts:
        # server3.example.com:
        #   ansible_host: 10.0.2.10
      vars:
        ansible_python_interpreter: /usr/bin/python2

    rhel8:
      hosts:
        # server5.example.com:
        #   ansible_host: 10.0.3.10
      vars:
        ansible_python_interpreter: /usr/libexec/platform-python

    rhel9:
      hosts:
        # server7.example.com:
      vars:
        ansible_python_interpreter: auto_silent

    rhel10:
      hosts:
        # server9.example.com:
      vars:
        ansible_python_interpreter: auto_silent

    ubuntu:
      hosts:
        # ubuntu1.example.com:
      vars:
        ansible_python_interpreter: auto_silent

    # Windows hosts must be in this group: the Windows play targets it, and the
    # Linux play excludes it. Pick one connection type.
    windows:
      hosts:
        # win1.example.com:
      vars:
        ansible_connection: winrm          # or psrp, or ssh
        ansible_winrm_transport: kerberos  # or ntlm / credssp / certificate
        ansible_port: 5986
        ansible_winrm_scheme: https
        # For OpenSSH on Windows instead:
        # ansible_connection: ssh
        # ansible_shell_type: powershell

  vars:
    # Common connection settings
    ansible_user: ansible_svc
    # ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # ansible_port: 22
