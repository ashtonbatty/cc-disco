---
# Listening Ports (Windows)
#
# win_listen_ports_facts publishes tcp_listen / udp_listen directly as facts,
# in the same shape the Linux tasks produce.

- name: Collect listening port facts
  ansible.windows.win_listen_ports_facts:
  failed_when: false
  tags: [ports]

- name: Publish listening port facts as unavailable
  # win_listen_ports_facts sets no fact when it fails. A literal null keeps the null convention.
  ansible.builtin.set_fact:
    cacheable: true
    tcp_listen: null
    udp_listen: null
  when: ansible_facts.tcp_listen is not defined
  tags: [ports]
