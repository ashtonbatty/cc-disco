---
# Installed Software, Hotfixes and Roles (Windows)
#
# Windows has no package_facts, so installed programs are read from the Uninstall
# registry keys and published as `packages` in package_facts shape
# ({name: [{name, version, ...}]}), letting the same query work on every OS.
# Per-user (HKCU) installs are not included.

- name: List installed programs from the registry
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $keys = @(
          @{ Path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'; Arch = 'x64' },
          @{ Path = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'; Arch = 'x86' }
      )
      foreach ($key in $keys) {
          Get-ItemProperty -Path $key.Path -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName } |
              ForEach-Object {
                  [PSCustomObject]@{
                      name         = [string]$_.DisplayName
                      version      = [string]$_.DisplayVersion
                      publisher    = [string]$_.Publisher
                      install_date = [string]$_.InstallDate
                      arch         = $key.Arch
                  }
              }
      }
  register: disco_win_programs
  changed_when: false
  failed_when: false
  tags: [packages]

- name: List installed hotfixes
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      Get-HotFix -ErrorAction SilentlyContinue | ForEach-Object {
          $installed = $null
          try { if ($_.InstalledOn) { $installed = $_.InstalledOn.ToString('yyyy-MM-dd') } } catch { }
          [PSCustomObject]@{
              id           = [string]$_.HotFixID
              description  = [string]$_.Description
              installed_on = $installed
          }
      }
  register: disco_win_hotfixes
  changed_when: false
  failed_when: false
  tags: [packages]

- name: List Windows Server roles and features
  # Fails on client SKUs (no ServerManager module); published as null there.
  ansible.windows.win_feature_info:
  register: disco_win_features
  failed_when: false
  tags: [packages]

- name: Publish installed programs as packages
  ansible.builtin.set_fact:
    cacheable: true
    packages: >-
      {%- set result = {} -%}
      {%- for p in disco_win_programs.output | default([]) -%}
        {%- set entry = {
              'name': p.name,
              'version': p.version or none,
              'publisher': p.publisher or none,
              'install_date': p.install_date or none,
              'arch': p.arch,
              'source': 'registry',
            } -%}
        {%- set _ = result.update({p.name: result.get(p.name, []) + [entry]}) -%}
      {%- endfor -%}
      {{ result }}
  when: disco_win_programs is disco_collected
  tags: [packages]

- name: Publish installed programs as unavailable
  # A literal null: a templated none would render as "" on ansible-core < 2.19.
  ansible.builtin.set_fact:
    cacheable: true
    packages: null
  when: disco_win_programs is not disco_collected
  tags: [packages]

- name: Publish Windows package facts
  ansible.builtin.set_fact:
    cacheable: true
    disco_packages: >-
      {{ {
           'hotfixes': (disco_win_hotfixes.output | sort(attribute='id'))
             if disco_win_hotfixes is disco_collected else none,
           'features': (disco_win_features.features | selectattr('installed') | map(attribute='name') | sort)
             if disco_win_features is disco_collected and disco_win_features.exists | default(false) else none,
         } }}
  tags: [packages]
