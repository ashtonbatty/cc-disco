---
# Storage
#
# setup already reports mounts with usage (ansible_mounts), block devices
# (ansible_devices) and LVM PVs/VGs/LVs (ansible_lvm, when run as root).
# This adds the configured fstab and multipath topology, in one task (see
# disco_probe_sh in vars/controls.yml).

- name: Probe fstab and multipath topology
  ansible.builtin.shell: |
    set -o pipefail
    {{ disco_probe_sh }}
    probe fstab cat /etc/fstab
    probe multipath multipath -ll
    exit 0
  args:
    executable: /bin/bash
  register: disco_storage_probes
  changed_when: false
  failed_when: false
  tags: [storage]

- name: Publish storage facts
  ansible.builtin.set_fact:
    cacheable: true
    disco_storage: >-
      {%- set p = disco_storage_probes | disco_probes -%}
      {%- set fstab = p.fstab.stdout | default('') | trim -%}
      {%- set mpath = p.multipath.stdout | default('') | trim -%}
      {{ {
           'fstab': fstab if p.fstab is disco_collected and fstab else none,
           'multipath': mpath if p.multipath is disco_collected and mpath else none,
         } }}
  tags: [storage]
