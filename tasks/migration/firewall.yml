---
# Firewall
#
# service_facts already reports whether firewalld / iptables / nftables services run.
# This adds the active rule sets. All probes run in one task (see disco_probe_sh
# in vars/controls.yml).

- name: Probe firewalld zones, iptables and nftables rules
  ansible.builtin.shell: |
    set -o pipefail
    {{ disco_probe_sh }}
    [ -n "$DISCO_FIREWALLD" ] && probe firewalld firewall-cmd --list-all-zones
    probe iptables iptables -L -n -v
    [ -n "$DISCO_NFT" ] && probe nftables nft list ruleset
    exit 0
  args:
    executable: /bin/bash
  environment:
    # firewall-cmd only answers while firewalld runs; nftables is RHEL 8+.
    DISCO_FIREWALLD: >-
      {{ 'yes' if (ansible_facts.services | default({}, true)).get('firewalld.service',
           (ansible_facts.services | default({}, true)).get('firewalld', {})).state | default('') == 'running' else '' }}
    DISCO_NFT: "{{ 'yes' if rhel_major | int >= 8 else '' }}"
  register: disco_firewall_probes
  changed_when: false
  failed_when: false
  tags: [firewall]

- name: Publish firewall facts
  ansible.builtin.set_fact:
    cacheable: true
    disco_firewall: >-
      {%- set p = disco_firewall_probes | disco_probes -%}
      {%- set zones = p.firewalld.stdout | default('') | trim -%}
      {%- set ipt = p.iptables.stdout | default('') | trim -%}
      {%- set nft = p.nftables.stdout | default('') | trim -%}
      {{ {
           'firewalld_zones': zones if p.firewalld is disco_collected and zones else none,
           'iptables_rules': ipt if p.iptables is disco_collected and ipt else none,
           'nftables_rules': nft if p.nftables is disco_collected and nft else none,
         } }}
  tags: [firewall]
