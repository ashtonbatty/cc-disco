---
# Filesystem Exploration

- name: List /opt subdirectories
  ansible.builtin.find:
    paths: /opt
    file_type: directory
    recurse: false
  register: disco_opt_listing
  failed_when: false
  when: collect_deep_filesystem | bool
  tags: [filesystem, deep_filesystem]

- name: List /data subdirectories
  ansible.builtin.find:
    paths: /data
    file_type: directory
    recurse: false
  register: disco_data_listing
  failed_when: false
  when: collect_deep_filesystem | bool
  tags: [filesystem, deep_filesystem]

- name: Check third-party software in common paths
  # This is a bespoke directory inventory across multiple optional roots.
  ansible.builtin.shell: |
    for d in /usr/local/bin /usr/local/sbin /app /apps /software; do
      if [ -d "$d" ]; then
        listing=$(ls -1 "$d" 2>/dev/null)
        if [ -n "$listing" ]; then
          echo "=== ${d} ==="
          echo "$listing"
        fi
      fi
    done
  args:
    executable: /bin/bash
  register: disco_third_party_paths
  changed_when: false
  failed_when: false
  when: (collect_deep_filesystem | bool) and (collect_command_heavy_probes | bool)
  tags: [filesystem, deep_filesystem]

- name: Publish filesystem facts
  ansible.builtin.set_fact:
    cacheable: true
    disco_filesystem: >-
      {%- set third_party = disco_third_party_paths.stdout | default('') | trim -%}
      {{ {
           'opt': (disco_opt_listing.files | map(attribute='path') | sort)
             if disco_opt_listing.files is defined else none,
           'data': (disco_data_listing.files | map(attribute='path') | sort)
             if disco_data_listing.files is defined else none,
           'third_party_paths': (third_party or none) if disco_third_party_paths.rc is defined else none,
         } }}
  tags: [filesystem, deep_filesystem]
