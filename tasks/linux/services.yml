---
# Services (every Linux host)
#
# service_facts publishes ansible_facts.services for systemd, SysV (including
# chkconfig enablement) and upstart. Nothing else is needed here: the init system
# is already in ansible_service_mgr.

- name: Collect service facts
  ansible.builtin.service_facts:
  failed_when: false
  tags: [services, firewall]
