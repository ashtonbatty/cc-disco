---
# Listening Ports (every Linux host)
#
# Published as tcp_listen / udp_listen in the same shape as
# ansible.windows.win_listen_ports_facts (and community.general.listen_ports_facts),
# so the same query works on every OS. Built from ss (or netstat) to stay on
# ansible.builtin modules. The owning user comes from the process list (tag: processes).

- name: List listening TCP/UDP sockets
  # Emits tool|proto|local_address:port|process for each listening socket.
  ansible.builtin.shell: |
    set -o pipefail
    if command -v ss >/dev/null 2>&1; then
      ss -tulpn 2>/dev/null | awk 'NR > 1 { print "ss|" $1 "|" $5 "|" $7 }'
    elif command -v netstat >/dev/null 2>&1; then
      netstat -tulpn 2>/dev/null | awk '$1 ~ /^(tcp|udp)/ { print "netstat|" $1 "|" $4 "|" $NF }'
    else
      exit 127
    fi
  args:
    executable: /bin/bash
  register: disco_listen
  changed_when: false
  failed_when: false
  tags: [ports]

- name: Publish listening port facts
  ansible.builtin.set_fact:
    cacheable: true
    tcp_listen: "{{ disco_listen_all | selectattr('protocol', 'match', '^tcp') | list }}"
    udp_listen: "{{ disco_listen_all | selectattr('protocol', 'match', '^udp') | list }}"
  vars:
    # ss process field: users:(("sshd",pid=812,fd=3)) or, on RHEL 6, users:(("sshd",812,3)).
    # netstat process field: 812/sshd.
    disco_listen_all: >-
      {%- set users = {} -%}
      {%- for line in disco_ps.stdout_lines | default([]) -%}
        {%- set f = line.split(None, 3) -%}
        {%- if f | length >= 3 -%}{%- set _ = users.update({f[0]: f[2]}) -%}{%- endif -%}
      {%- endfor -%}
      {%- set result = [] -%}
      {%- for line in disco_listen.stdout_lines | default([]) -%}
        {%- set f = line.split('|') -%}
        {%- if f | length == 4 and ':' in f[2] -%}
          {%- set base = f[1] | regex_replace('6$', '') -%}
          {%- set address = (f[2].rsplit(':', 1) | first) | regex_replace('^\\[|\\]$', '') | regex_replace('%.*$', '') -%}
          {%- set port = f[2].rsplit(':', 1) | last -%}
          {%- if f[0] == 'ss' -%}
            {%- set m = f[3] | regex_search('\\(\\("([^"]+)",(?:pid=)?(\\d+)', '\\1', '\\2') -%}
          {%- else -%}
            {%- set m = f[3] | regex_search('^(\\d+)/(.*)$', '\\2', '\\1') -%}
          {%- endif -%}
          {%- set pid = (m[1] | int) if m else none -%}
          {%- set _ = result.append({
                'protocol': base ~ ('6' if ':' in address else ''),
                'address': address,
                'port': port | int,
                'name': m[0] if m else none,
                'pid': pid,
                'user': users.get(pid | string) if pid else none,
              }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  when: disco_listen is disco_collected
  tags: [ports]

- name: Publish listening port facts as unavailable
  # A literal null: a templated none would render as "" on ansible-core < 2.19.
  ansible.builtin.set_fact:
    cacheable: true
    tcp_listen: null
    udp_listen: null
  when: disco_listen is not disco_collected
  tags: [ports]
