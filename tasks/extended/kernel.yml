---
# Kernel, Modules, Boot, Tuning
#
# setup already reports the running kernel (ansible_kernel) and its command line
# (ansible_cmdline). This adds loaded modules, GRUB defaults and the tuned profile.
# All probes run in one task (see disco_probe_sh in vars/controls.yml).

- name: Probe kernel modules, GRUB defaults and tuned profile
  ansible.builtin.shell: |
    set -o pipefail
    {{ disco_probe_sh }}
    # Module author/filepath correlation is not exposed by Ansible facts.
    third_party_modules() {
      for mod in $(lsmod | awk 'NR>1{print $1}'); do
        info=$(modinfo "$mod" 2>/dev/null)
        filename=$(echo "$info" | grep -i '^filename:' | head -1 | awk '{print $2}')
        # No filename means modinfo cannot place the module, so it cannot be classified.
        if [ -n "$filename" ] && echo "$filename" | grep -qv '/kernel/'; then
          author=$(echo "$info" | grep -i '^author:' | head -1 | sed 's/^author: *//')
          echo "${mod}|${filename}|${author}"
        fi
      done
    }
    probe lsmod lsmod
    [ -n "$DISCO_DEEP" ] && probe third_party_modules third_party_modules
    probe grub cat /etc/default/grub
    probe tuned tuned-adm active
    exit 0
  args:
    executable: /bin/bash
  environment:
    DISCO_DEEP: "{{ 'yes' if collect_deep_kernel | bool and collect_command_heavy_probes | bool else '' }}"
  register: disco_kernel_probes
  changed_when: false
  failed_when: false
  tags: [kernel, deep_kernel]

- name: Publish kernel facts
  # Deprecated modules: loaded modules that RHEL 9/10 no longer ship. lsmod
  # prints names with underscores (3w-9xxx loads as 3w_9xxx).
  ansible.builtin.set_fact:
    cacheable: true
    disco_kernel: >-
      {%- set p = disco_kernel_probes | disco_probes -%}
      {%- set third_party = [] -%}
      {%- for line in p.third_party_modules.stdout_lines | default([]) -%}
        {%- set f = line.split('|') -%}
        {%- set _ = third_party.append({
              'module': f[0],
              'filename': (f[1] | default('')) or none,
              'author': (f[2] | default('')) or none,
            }) -%}
      {%- endfor -%}
      {%- set loaded = (p.lsmod.stdout_lines[1:] | map('regex_replace', '\\s.*$', '') | list)
           if p.lsmod is disco_collected else none -%}
      {%- set deprecated = ['floppy', 'mptbase', 'mptscsih', 'mptspi', 'megaraid', 'aacraid', '3w_9xxx', '3w_sas'] -%}
      {%- set grub = p.grub.stdout | default('') | trim -%}
      {%- set tuned = p.tuned.stdout | default('') | regex_replace('^Current active profile:\\s*', '') | trim -%}
      {{ {
           'loaded_modules': loaded,
           'third_party_modules': third_party if p.third_party_modules is disco_collected else none,
           'deprecated_modules': (deprecated | select('in', loaded) | list)
             if loaded is not none and collect_deep_kernel | bool else none,
           'grub_defaults': grub if p.grub is disco_collected and grub else none,
           'tuned_profile': tuned if p.tuned is disco_collected and tuned else none,
         } }}
  tags: [kernel, deep_kernel]
