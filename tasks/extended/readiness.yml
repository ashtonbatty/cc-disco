---
# Migration Readiness (for the next RHEL major)
#
# Package-derived lists use ansible_facts.packages (tag: packages). Interpreter,
# OpenSSL and Java versions are in disco_components; time-service and
# NetworkManager state are in ansible_facts.services. All probes run in one task
# (see disco_probe_sh in vars/controls.yml); it reads fstab itself, so
# --tags readiness needs nothing from the storage section.

- name: Probe fstab, xinetd, alternatives and cron
  ansible.builtin.shell: |
    set -o pipefail
    {{ disco_probe_sh }}
    # alternatives --list is not available on RHEL 6; fall back to its state directory.
    alternatives_list() {
      alternatives --list 2>/dev/null && return 0
      for alt in /var/lib/alternatives/*; do
        [ -f "$alt" ] || continue
        printf '%s\t%s\t%s\n' "$(basename "$alt")" "auto" "$(head -1 "$alt" 2>/dev/null)"
      done
    }
    probe fstab cat /etc/fstab
    if [ -n "$DISCO_HEAVY" ]; then
      probe_ls xinetd /etc/xinetd.d '*' -f
      probe alternatives alternatives_list
      probe root_crontab crontab -l
      probe system_crontab cat /etc/crontab
      probe_ls cron_d /etc/cron.d '*' -f
    fi
    exit 0
  args:
    executable: /bin/bash
  environment:
    DISCO_HEAVY: "{{ 'yes' if collect_command_heavy_probes | bool else '' }}"
  register: disco_readiness_probes
  changed_when: false
  failed_when: false
  tags: [readiness]

- name: Publish migration readiness facts
  ansible.builtin.set_fact:
    cacheable: true
    disco_readiness: >-
      {%- set p = disco_readiness_probes | disco_probes -%}
      {%- set pkgs = ansible_facts.packages | default({}, true) -%}
      {%- set have_pkgs = pkgs | length > 0 -%}
      {%- set pkg32 = [] -%}
      {%- set java = [] -%}
      {%- for name in pkgs | sort -%}
        {%- for v in pkgs[name] -%}
          {%- set nevra = name ~ '-' ~ v.version | default('') ~ '-' ~ v.release | default('') ~ '.' ~ v.arch | default('') -%}
          {%- if (v.arch | default('')) is match('i[36]86') -%}{%- set _ = pkg32.append(nevra) -%}{%- endif -%}
          {%- if name is match('^java-.*-(openjdk|oracle|ibm|corretto|zulu|temurin).*$') -%}{%- set _ = java.append(nevra) -%}{%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- set deprecated = ['ntp', 'sendmail', 'vsftpd', 'xinetd', 'talk', 'ypserv', 'ypbind', 'iptables-services', 'net-tools']
           | select('in', pkgs) | list -%}
      {%- set fstab_concerns = (p.fstab.stdout_lines | default([])) | map('trim') | reject('match', '#')
           | select('search', 'nfs|cifs|ext[23]|_netdev') | list -%}
      {%- set alts = p.alternatives.stdout | default('') | trim -%}
      {%- set root_cron = p.root_crontab.stdout | default('') | trim -%}
      {%- set sys_cron = p.system_crontab.stdout | default('') | trim -%}
      {{ {
           'packages_32bit': pkg32 if have_pkgs else none,
           'deprecated_packages': deprecated if have_pkgs else none,
           'java_packages': java if have_pkgs else none,
           'fstab_concerns': fstab_concerns if p.fstab is disco_collected else none,
           'xinetd_services': (p.xinetd.stdout_lines | map('basename') | sort) if p.xinetd is disco_collected else none,
           'alternatives': alts if p.alternatives is disco_collected and alts else none,
           'root_crontab': root_cron if p.root_crontab is disco_collected and root_cron else none,
           'system_crontab': sys_cron if p.system_crontab is disco_collected and sys_cron else none,
           'cron_d_entries': (p.cron_d.stdout_lines | map('basename') | sort) if p.cron_d is disco_collected else none,
         } }}
  tags: [readiness]
